; Import preset "weapon": viewmodel guns and attachments. Mesh compression OFF (the sight markers and the hand
; points must land exactly; compressed vertex positions drift ~1 mm), no LODs (always close to the eye), no shadow
; meshes (the viewmodel casts none), animations kept (pack reloads are retargeted by the intake builder).
; Claimed by path: anything under a folder named "weapons", a Sketchfab / OpenGameArt gun folder, or a folder with
; an import_preset.txt saying "weapon".

[preset]

importer="scene"
type="PackedScene"
extensions=["glb", "gltf", "fbx"]
match=["*/weapons/*", "*/sketchfab/*", "*/opengameart/*", "*/unity_asset_store/*gun*", "*/unity_asset_store/*weapon*"]
priority=20

[params]

nodes/root_type=""
nodes/root_name=""
nodes/root_script=null
mesh_library/use_node_names_as_mesh_names=false
array_mesh/deduplicate_surfaces=true
nodes/apply_root_scale=true
nodes/root_scale=1.0
nodes/import_as_skeleton_bones=false
nodes/use_name_suffixes=true
nodes/use_node_type_suffixes=true
meshes/ensure_tangents=true
meshes/generate_lods=false
meshes/create_shadow_meshes=false
meshes/light_baking=0
meshes/lightmap_texel_size=0.2
meshes/force_disable_compression=true
skins/use_named_skins=true
animation/import=true
animation/fps=30
animation/trimming=false
animation/remove_immutable_tracks=true
animation/import_rest_as_RESET=false
import_script/path=""
materials/extract=0
materials/extract_format=0
materials/extract_path=""
_subresources={}
gltf/naming_version=2
gltf/embedded_image_handling=1
gltf/texture_map_mode=1
